[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beampath"
version = "0.1.0"
description = "A Python DSL for optical setup diagrams"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["kiwisolver>=1.4"]

[project.optional-dependencies]
png = ["cairosvg>=2.7"]
pdf = ["cairosvg>=2.7", "pypdf>=4"]
dev = ["pytest>=8", "build>=1", "setuptools>=68", "Pillow>=10"]

[tool.setuptools]
packages = ["beampath", "beampath.assets", "beampath.examples"]

[tool.setuptools.package-dir]
beampath = "src/beampath"
"beampath.examples" = "examples"

[tool.setuptools.package-data]
beampath = ["assets/*.svg", "assets/*.json", "assets/LICENSE", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
